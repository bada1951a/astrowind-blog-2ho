name: Auto Multi-Language Blog Publishing Pipeline

on:
  schedule:
    # 2호기 스케줄: 한국 시간 밤 21:28 (UTC 12:28) / 아침 06:28 (UTC 21:28)
    # 1호기와 30분 시차를 두어 API 제한 회피 및 정각 병목 회피
    - cron: '28 12,21 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Multi-Language Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generate-all.mjs

      - name: Commit and Push New Posts & Updated Topics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/post/ topics.txt
          if git diff --staged --quiet; then
            echo "변경사항이 없습니다."
          else
            git commit -m "chore: auto-publish 12-language mobile blog posts"
            git push origin main
          fi
