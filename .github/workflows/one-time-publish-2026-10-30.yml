name: One-time 2ho publish 2026-10-30 07:00 KST

on:
  schedule:
    - cron: '0 7 30 10 *'
      timezone: 'Asia/Seoul'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Confirm one-time date
        id: date
        shell: bash
        run: |
          if [[ "$(TZ=Asia/Seoul date +%F)" == "2026-10-30" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.date.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate and build
        if: steps.date.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npm install --legacy-peer-deps
          node generate-all.mjs
          npm run build

      - name: Commit and push generated posts
        if: steps.date.outputs.run == 'true' && success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/post topics.txt
          git commit -m "One-time 2ho multi-language publish 2026-10-30" || echo "No changes to commit"
          git push

      - name: Remove one-time schedule
        if: always()
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-time-publish-2026-10-30.yml || true
          git commit -m "Remove one-time 2ho publish schedule" || true
          git push
